name: generate snake
on:
  schedule:
    - cron: "17 0 * * *"   # daily, just after UTC midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: x3vu
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=purple&color_dots=#1a1b4b,#39d353,#26c281,#00e676,#00c853
            dist/snake-dark.svg?palette=github-dark&color_snake=E100FF&color_dots=#161b22,#7F00FF,#9C27B0,#E100FF,#FF4DFF
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
